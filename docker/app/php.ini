upload_max_filesize = 200M
post_max_size = 210M
memory_limit = 512M
max_execution_time = 120

; OPcache — l'image est immuable en production, on peut désactiver la
; revalidation des timestamps pour éviter un stat() par fichier inclus.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
