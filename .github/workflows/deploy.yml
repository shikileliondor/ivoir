name: Deploy to VPS

on:
  workflow_dispatch:
  push:
    branches:
      # - main
    paths-ignore:
      - 'prompts/**'
      - '.claude/**'
      - '.cursor/**'
      - '**.md'

# Deux déploiements simultanés se marcheraient dessus sur le VPS (même
# working tree git, même compose). Le second attend que le premier finisse.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # L'image est construite ICI, jamais sur le VPS : celui-ci n'a que ~2,7 Gi de
  # marge mémoire et fait déjà tourner lokea et dymora_app en production. Un
  # `npm run build` sur place (2 950 modules, three.js) réveillerait l'OOM
  # killer, qui tuerait le plus gros processus — pas forcément le nôtre.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute image name
        id: meta
        # GHCR n'accepte que des minuscules dans le namespace.
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/ivoir-app" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Authenticate the VPS to GHCR
        # Le jeton passe par stdin, jamais en argument : il n'apparaît donc pas
        # dans la liste des processus du VPS. GITHUB_TOKEN expire à la fin du
        # job, d'où le `docker logout` en fin de déploiement.
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy on VPS
        env:
          IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=60 \
              -o ServerAliveCountMax=30 \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "IVOIR_IMAGE='${IMAGE}' bash -s" << 'EOF'
            set -e

            git config --global --add safe.directory /var/www/ivoir
            cd /var/www/ivoir

            # Le dépôt reste nécessaire : docker-compose.prod.yml, le .env et
            # storage/images (photos produit versionnées) viennent de là.
            git reset --hard HEAD
            git pull origin master

            # Épingle le SHA déployé pour que `up -d` et un éventuel retour en
            # arrière portent sur exactement la même image.
            export IVOIR_IMAGE
            echo "Image déployée : $IVOIR_IMAGE"

            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d

            # `up -d` rend la main dès que le conteneur démarre, pas quand
            # l'app répond : start.sh doit encore poser les liens storage et
            # construire les caches. Migrer trop tôt échouerait.
            echo "Attente du conteneur app…"
            status=""
            for _ in $(seq 1 60); do
              status=$(docker compose -f docker-compose.prod.yml ps --format '{{.Health}}' app 2>/dev/null | head -1)
              [ "$status" = "healthy" ] && break
              sleep 5
            done

            if [ "$status" != "healthy" ]; then
              echo "Le conteneur app n'est pas healthy (état : ${status:-inconnu})."
              docker compose -f docker-compose.prod.yml logs --tail=80 app
              exit 1
            fi

            # --user www-data : sans ça les fichiers créés appartiennent à
            # root et PHP-FPM ne peut plus écrire dans storage/.
            # -T : pas de TTY disponible en SSH/CI, sinon la commande bloque.
            docker compose -f docker-compose.prod.yml exec -T --user www-data app \
              php artisan migrate --force

            # Pas de config:cache / route:cache / view:cache ici : start.sh
            # lance déjà `php artisan optimize` à chaque démarrage, une fois
            # le vrai .env monté.

            # Chaque déploiement laisse l'image précédente orpheline (~900 Mo).
            docker image prune -f

            # Le jeton n'est plus valide après le job : ne pas le laisser traîner.
            docker logout ghcr.io

            echo "Déploiement terminé."
          EOF
